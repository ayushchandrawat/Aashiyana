```yaml
services:
  aashiyana:
    image: ghcr.io/ayushchandrawat/aashiyana:latest
    build: .                          # Optional: use --build to build locally
    container_name: aashiyana
    restart: unless-stopped

    ports:
      # Host port is configured through AASHIYANA_HTTP_PORT in .env.
      # Aashiyana listens on port 3000 inside the container.
      #
      # Default:
      #   http://localhost:8090
      - "0.0.0.0:${AASHIYANA_HTTP_PORT:-8090}:3000"

    volumes:
      # Persistent application data
      - ${DATA_DIR:-./data}:/data

      # Persistent backups
      - ${BACKUP_DIR:-./backups}:/backups

      # Aashiyana modules.
      # Add modules to ./modules or set MODULES_DIR in .env.
      - ${MODULES_DIR:-./modules}:/app/modules

      # Optional local document storage.
      # The host and container paths can both be configured through .env.
      - ${DOCUMENT_STORAGE_LOCAL_DIR:-./documents}:${DOCUMENT_STORAGE_LOCAL_PATH:-/documents}

    # Keep the short env_file syntax for compatibility with older
    # Docker Compose and container management platforms.
    #
    # The installer creates the .env file and configures required
    # variables such as SESSION_SECRET.
    env_file:
      - .env

    environment:
      # Application environment
      - NODE_ENV=production

      # Database
      - DB_PATH=${DB_PATH:-/data/aashiyana.db}

      # Backup storage
      - BACKUP_DIR=/backups

      # Local document storage (optional)
      # Set to true to store uploaded documents in the mounted
      # /documents directory.
      - DOCUMENT_STORAGE_LOCAL_ENABLED=${DOCUMENT_STORAGE_LOCAL_ENABLED:-false}
      - DOCUMENT_STORAGE_LOCAL_PATH=${DOCUMENT_STORAGE_LOCAL_PATH:-/documents}

      # Secure cookies
      #
      # Reverse proxy + HTTPS:
      #   SESSION_SECURE=true
      #   TRUST_PROXY=1
      #
      # Direct HTTP access:
      #   SESSION_SECURE=false
      #   TRUST_PROXY=loopback
      #
      # Default:
      #   SESSION_SECURE=false
      - SESSION_SECURE=${SESSION_SECURE:-false}

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
```
